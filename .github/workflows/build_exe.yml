name: Build Mass Email Tool v5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # customtkinter = the modern dark-mode UI library
          pip install openpyxl customtkinter pyinstaller

      - name: Build EXE
        run: |
          # --noconsole       : the GUI is the only window; no cmd box
          # --collect-all     : bundles CustomTkinter's theme + asset files
          # --clean           : nuke any stale PyInstaller cache
          # --noconfirm       : don't prompt on overwrite
          pyinstaller --noconfirm --clean --onefile --noconsole \
            --name "MassEmailTool_v5" \
            --collect-all customtkinter \
            mass_email_v5.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MassEmailTool_v5_Windows
          path: dist/MassEmailTool_v5.exe
          retention-days: 30
