name: Build Mass Email Tool v3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywin32 openpyxl pyinstaller

      - name: Build EXE
        run: |
          # Note: We do NOT use --noconsole here so you can see the error messages if it fails
          pyinstaller --onefile --name "MassEmailTool_v3" mass_email_v3.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MassEmailTool_v3_Windows
          path: dist/MassEmailTool_v3.exe
          retention-days: 30
