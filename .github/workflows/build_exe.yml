name: Build Mass Email Tool v4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pywin32 is no longer needed — the tool talks to mail servers
          # directly over SMTP. openpyxl + pyinstaller are all we need.
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: |
          # No --noconsole: the console window is useful for the first-run
          # bootstrap messages (template created, credentials prompt, etc.)
          pyinstaller --onefile --name "MassEmailTool_v4" mass_email_v4.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MassEmailTool_v4_Windows
          path: dist/MassEmailTool_v4.exe
          retention-days: 30
