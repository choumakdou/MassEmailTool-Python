name: Build Mass Email Tool v6

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # customtkinter = the modern dark-mode UI library
          pip install openpyxl customtkinter pyinstaller

      - name: Build EXE
        # Single line — PowerShell on windows-latest chokes on `\` line
        # continuations in YAML literal blocks.
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name "MassEmailTool_v6" --collect-all customtkinter mass_email_v6.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MassEmailTool_v6_Windows
          path: dist/MassEmailTool_v6.exe
          retention-days: 30
